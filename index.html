:root {
  color-scheme: dark;
  --noite: #26292c; --noite-2: #303337; --noite-3: #3c4045; --marfim: #f2ede3; --ouro: #c9a96a;
  --tinta: #f2ede3; --tinta-2: rgb(242 237 227 / .80); --tinta-3: rgb(242 237 227 / .58);
  --linha: rgb(242 237 227 / .12); --linha-forte: rgb(242 237 227 / .24); --azul: #a9bd98;
  --fonte: "Cifras", "InterVariable", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --serif: "SourceSerif4", "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --e2: 8px; --e3: 12px; --e4: 16px; --e5: 24px; --e6: 32px; --e8: 64px;
  --curva: cubic-bezier(.22, 1, .36, 1); --t-rapido: 140ms;
  --largura: 1200px; --barra: 56px; --caixa-pad: 56px; --lado: 32px; --borda: calc(var(--lado) + var(--caixa-pad));
}
@media (max-width: 1024px) { :root { --caixa-pad: 40px; --lado: 24px; } }
@media (max-width: 640px) { :root { --caixa-pad: 20px; --lado: 16px; } }
html, body { margin: 0; background: var(--noite); }
.tranca {
  min-height: 100vh; min-height: 100dvh; box-sizing: border-box; color: var(--tinta);
  font: 400 15px/22px var(--fonte); font-optical-sizing: auto; font-variant-numeric: lining-nums tabular-nums; -webkit-font-smoothing: antialiased;
  padding-top: calc(var(--barra) + 1px + env(safe-area-inset-top, 0px));
}
.tranca *, .tranca *::before, .tranca *::after { box-sizing: border-box; }
.tranca ::selection { background: rgb(169 189 152 / .25); }
.tranca__in {
  max-width: calc(var(--largura) + 2 * var(--borda)); margin: 0 auto; padding: 32px var(--borda) var(--e8);
  padding-left: max(var(--borda), env(safe-area-inset-left, 0px)); padding-right: max(var(--borda), env(safe-area-inset-right, 0px));
}
.rotulo { font: 500 13px/18px var(--fonte); color: var(--tinta-3); margin: 0 0 var(--e2); }
.heroi { font: 400 54px/58px var(--serif); font-variation-settings: "opsz" 20; letter-spacing: -.012em; margin: 0; text-wrap: balance; }
.tranca__p { margin: var(--e5) 0 var(--e4); color: var(--tinta-2); max-width: 48ch; text-wrap: pretty; }
.tranca__form { display: flex; flex-wrap: wrap; align-items: center; gap: var(--e3); }
.tranca__campo {
  all: unset; box-sizing: border-box; flex: 1 1 160px; min-width: 0; max-width: 240px; height: 40px; padding: 0 14px; border-radius: 10px;
  background: var(--noite-2); border: 1px solid var(--linha); color: var(--tinta); font: 400 16px/24px var(--fonte); letter-spacing: .08em;
  transition: border-color var(--t-rapido) var(--curva), background-color var(--t-rapido) var(--curva);
}
.tranca__campo::placeholder { color: var(--tinta-3); letter-spacing: 0; }
.tranca__campo:hover { border-color: var(--linha-forte); }
.tranca__campo:focus-visible { border-color: var(--azul); outline: 2px solid var(--azul); outline-offset: 1px; }
.tranca__campo:disabled { opacity: .6; }
.tranca__botao {
  all: unset; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 18px; border-radius: 999px;
  background: var(--marfim); color: var(--noite); font: 500 14px/20px var(--fonte); white-space: nowrap; cursor: pointer;
  box-shadow: 0 0 0 .5px rgb(0 0 0 / .4), 0 1px 2px rgb(0 0 0 / .5);
  transition: background-color var(--t-rapido) var(--curva), scale 100ms var(--curva), opacity var(--t-rapido) var(--curva);
}
.tranca__botao:hover { background: #fff; }
.tranca__botao:active { scale: .97; }
.tranca__botao:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }
.tranca__botao:disabled { opacity: .55; cursor: default; }
.tranca__msg { margin: var(--e3) 0 0; min-height: 22px; font: 400 14px/22px var(--fonte); color: var(--tinta-3); }
.tranca__msg.erro { color: var(--ouro); }
@media (max-width: 900px) { :root { --barra: 88px; } }
@media (max-width: 640px) {
  .heroi { font-size: 42px; line-height: 46px; }
  .tranca__in { padding-top: 21px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
/* senha errada: o campo e o botão balançam de leve */
@keyframes treme { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.tranca__form.treme { animation: treme 320ms var(--curva); }
/* já aberta nesta aba (recarregou a página): não mostra o pedido de senha enquanto decifra */
.tranca.direto .tranca__p, .tranca.direto .tranca__form, .tranca.direto .tranca__msg { visibility: hidden; }
@media (prefers-reduced-motion: reduce) { .tranca * { transition-duration: 1ms !important; animation-duration: 1ms !important; } }
</style>
<div class="tranca" id="tranca-tela" lang="pt-BR">
  <div class="tranca__in">
    <p class="rotulo">Bruno M., nov 2026</p>
    <h1 class="heroi">Feedback Decade</h1>
    <p class="tranca__p">Esta página é protegida. Para abrir, digite a senha.</p>
    <form class="tranca__form" id="tranca" method="dialog" autocomplete="off">
      <label for="senha" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap">Senha</label>
      <input class="tranca__campo" id="senha" type="password" placeholder="Senha" autocomplete="current-password" autocapitalize="characters" autocorrect="off" spellcheck="false" required autofocus>
      <button class="tranca__botao" id="abrir" type="submit">Abrir</button>
    </form>
    <p class="tranca__msg" id="msg" aria-live="polite"></p>
    <noscript><p class="tranca__msg erro">Esta página precisa de JavaScript para abrir. Abra em um navegador como Chrome, Safari ou Edge.</p></noscript>
  </div>
</div>
<script id="tranca-script">
/* decifra a página com a senha e a monta no lugar desta tela */
(function () {
  'use strict';
  const C = { sal: 'n4uNZmA5owiG2twC5HvX+g==', iv: 'TMnd+MP2KyV4I2l7', it: 600000, arq: 'conteudo.f118ef241dea.bin' };
  const raiz = document.documentElement, tela = document.getElementById('tranca-tela');
  const form = document.getElementById('tranca'), campo = document.getElementById('senha'), botao = document.getElementById('abrir'), msg = document.getElementById('msg');
  const b64 = (s) => { const b = atob(s); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  const para64 = (buf) => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  const diz = (t, erro) => { msg.textContent = t; msg.classList.toggle('erro', !!erro); };
  const travado = (on) => { campo.disabled = on; botao.disabled = on; botao.textContent = on ? 'Abrindo…' : 'Abrir'; };
  const sub = () => window.crypto && window.crypto.subtle;

  // A chave (não a senha) fica guardada só nesta aba, até ela fechar: recarregar a página não pede a senha de novo.
  // Vale para este arquivo apenas (confere pelo iv). Onde o navegador não deixa guardar, segue pedindo a senha.
  const CH = 'fd-chave';
  const guarda = {
    le() { try { const v = JSON.parse(sessionStorage.getItem(CH) || 'null'); return v && v.iv === C.iv ? v.k : null; } catch (e) { return null; } },
    poe(k) { try { sessionStorage.setItem(CH, JSON.stringify({ iv: C.iv, k })); } catch (e) {} },
    tira() { try { sessionStorage.removeItem(CH); } catch (e) {} },
  };
  async function chaveDaSenha(senha) {
    if (!sub()) throw new Error('sem-crypto');
    const base = await sub().importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
    return sub().deriveKey({ name: 'PBKDF2', salt: b64(C.sal), iterations: C.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  // o conteúdo cifrado: pedido já, para estar aqui quando a senha for digitada. Se a rede falhar, tenta de novo na hora de abrir.
  let carga = null;
  const pede = () => {
    carga = fetch(C.arq).then((r) => { if (!r.ok) throw new Error('rede'); return r.arrayBuffer(); }, () => { throw new Error('rede'); });
    carga.catch(() => {});
    return carga;
  };
  pede();
  const conteudo = () => carga.catch(() => pede());
  async function decifra(chave) {
    const dados = await conteudo();
    const texto = await sub().decrypt({ name: 'AES-GCM', iv: b64(C.iv) }, chave, dados);
    return new TextDecoder().decode(texto);
  }

  // troca a tela pela página sem document.write (dentro do artifact, o document.open travava o quadro):
  // estilos no head, corpo no body, e os scripts da página recriados para rodar.
  // Quem chegou com #item no endereço é levado até ele pelo script da página.
  function troca(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    raiz.lang = doc.documentElement.getAttribute('lang') || 'pt-BR';
    document.title = doc.title || document.title;
    ['tranca-estilo', 'tranca-tela', 'tranca-script'].forEach((id) => { const el = document.getElementById(id); if (el) el.remove(); });
    doc.head.querySelectorAll('style').forEach((el) => document.head.appendChild(document.adoptNode(el)));
    const scripts = Array.from(doc.body.querySelectorAll('script')).map((s) => { const c = s.textContent; s.remove(); return c; });
    document.body.append(...Array.from(doc.body.childNodes).map((n) => document.adoptNode(n)));
    window.scrollTo(0, 0);
    scripts.forEach((c) => { const s = document.createElement('script'); s.textContent = c; document.body.appendChild(s); });
  }
  // Com a senha recém-digitada, a página chega com movimento: a data e o título desta tela ficam onde estão
  // (a página os tem no mesmo pixel) e o resto aparece em volta. Recarregando, abre direto.
  function monta(html, anima) {
    const reduz = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!anima || reduz) { troca(html); return; }
    raiz.classList.add('entrando');
    const fim = () => setTimeout(() => raiz.classList.remove('entrando'), 1000);
    // "feito" garante que a troca aconteça uma vez só, venha ela da transição, da espera ou do caminho direto
    let feito = false;
    const umaVez = () => { if (feito) return; feito = true; troca(html); };
    if (typeof document.startViewTransition === 'function') {
      try {
        const t = document.startViewTransition(umaVez);
        t.finished.then(fim, fim);
        // rede de segurança: se a transição não começar em 1,5 s, a página abre sem ela
        setTimeout(() => { if (!feito) { try { t.skipTransition(); } catch (e) {} umaVez(); } }, 1500);
        return;
      } catch (e) {}
    }
    umaVez(); fim();
  }

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const senha = campo.value.trim().toUpperCase();
    if (!senha) { campo.focus(); return; }
    travado(true); diz('');
    try {
      const chave = await chaveDaSenha(senha);
      const html = await decifra(chave);
      try { guarda.poe(para64(await sub().exportKey('raw', chave))); } catch (e) {}
      monta(html, true);
    } catch (e) {
      travado(false);
      if (e && e.message === 'sem-crypto') diz('Este navegador não consegue decifrar a página aqui. Abra por https, em um navegador atualizado.', true);
      else if (e && e.message === 'rede') diz('Não foi possível carregar a página. Confira a conexão e tente de novo.', true);
      else {
        diz('Senha incorreta. Tente de novo.', true);
        form.classList.remove('treme'); void form.offsetWidth; form.classList.add('treme');
        campo.select(); campo.focus();
      }
    }
  });

  // já aberta nesta aba: decifra com a chave guardada e monta sem pedir a senha
  const k = guarda.le();
  if (k && sub()) {
    tela.classList.add('direto');
    sub().importKey('raw', b64(k), { name: 'AES-GCM' }, false, ['decrypt']).then(decifra).then((html) => monta(html, false))
      .catch((e) => { if (!(e && e.message === 'rede')) guarda.tira(); tela.classList.remove('direto'); campo.focus(); });
  }
})();
</script>
</body>
</html>
